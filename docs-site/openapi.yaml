openapi: 3.1.0
info:
  title: touchgrass API
  version: 1.0.0
  description: |
    Self-hosted blue-green deploys, metrics, and error tracking.
    Mirrors `internal/http/server.go` — update both together.

    All routes except `/api/health`, `/api/auth/login`,
    `/api/ingest`, and `/api/ingest/logs` require the session
    cookie from login. Reads accept any role; every mutating
    route requires the admin role (viewers get 403 `forbidden`).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api
    description: Same origin as the console
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Session and user management
  - name: ingest
    description: SDK report intake and key management
  - name: services
    description: Inventory, metrics, deploys, and audit
  - name: onboarding
    description: Promote fleet containers to managed services
  - name: alerts
    description: Metric rules and the notification center
  - name: issues
    description: Grouped errors and issue alert rules
  - name: logs
    description: Container and SDK log ingest, search, and context
  - name: system
    description: Host snapshot and image management
  - name: security
    description: Container posture, runtime findings, policies, and operator workflows
  - name: databases
    description: Postgres health, backups, and restores
  - name: performance
    description: Bounded agentless performance investigations and collector health
paths:
  /health:
    get:
      operationId: getHealth
      tags: [auth]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username:
                  type: string
                  description: Defaults to admin when empty
                password: { type: string }
      responses:
        '204': { description: Session cookie set }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session
      responses:
        '204': { description: Session cleared }
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: Session state
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, username, role]
                properties:
                  authenticated: { type: boolean }
                  username: { type: string }
                  role: { type: string, enum: [admin, viewer] }
  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List managed users (admin only, never includes hashes)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [auth]
      summary: Create a user (admin only)
      description: |
        Username shape `^[a-z0-9-]+$` (1-64 chars), password 12-72
        chars, role admin or viewer. Audits `user_create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string }
                role: { type: string, enum: [admin, viewer] }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Username taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      tags: [auth]
      summary: Reset a password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/role:
    post:
      operationId: setUserRole
      tags: [auth]
      summary: Change a role (admin only)
      description: Demoting or removing the last enabled admin is a 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, viewer] }
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would remove the last enabled admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/disable:
    post:
      operationId: disableUser
      tags: [auth]
      summary: Lock an account (admin only)
      description: Sessions die on the next request. Audits `user_update`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Account locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would remove the last enabled admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/enable:
    post:
      operationId: enableUser
      tags: [auth]
      summary: Unlock an account (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Account unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [auth]
      summary: Delete a user (admin only)
      description: Audit history keeps the username as text.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would remove the last enabled admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /ingest:
    post:
      operationId: ingestReport
      tags: [ingest]
      summary: Submit one SDK report
      security: [{ keyAuth: [] }]
      description: |
        Public by design; the per-service key is the credential.
        Bodies cap at 1MB. Payloads are never logged.
      parameters:
        - $ref: '#/components/parameters/KeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestReport'
      responses:
        '202':
          description: Report evaluated
          content:
            application/json:
              schema:
                type: object
                required: [sampled]
                properties:
                  sampled:
                    type: boolean
                    description: False when the key's sampling rate dropped this report
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Report exceeds 1MB }
  /ingest/logs:
    post:
      operationId: ingestLogBatch
      tags: [ingest]
      summary: Submit one batch of SDK log records
      security: [{ bearerAuth: [] }, { keyAuth: [] }]
      description: |
        Public by design; the per-service key is the credential, sent as
        `Authorization: Bearer <tg_key>` (or the `X-Touchgrass-Key` alias).
        Batches cap at 10MB and 1000 items. Validation is all-or-nothing:
        one invalid item rejects the batch with its index. Payloads are
        never logged.
      parameters:
        - name: Authorization
          in: header
          schema: { type: string, example: 'Bearer tg_0123456789abcdef0123456789abcdef' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SDKLogBatch'
      responses:
        '202':
          description: Batch stored
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: integer
                    description: Stored rows (the full batch; partial stores never happen)
        '400':
          description: Invalid batch or item
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/SDKLogItemError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Batch exceeds 10MB }
  /keys:
    get:
      operationId: listKeys
      tags: [ingest]
      summary: List a service's keys (prefixes only)
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
    post:
      operationId: createKey
      tags: [ingest]
      summary: Mint a key (plaintext returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, sample_rate]
              properties:
                service_id: { type: string }
                sample_rate: { type: number, minimum: 0, maximum: 1 }
      responses:
        '201':
          description: Key minted
          content:
            application/json:
              schema:
                type: object
                required: [id, service_id, key, key_prefix, sample_rate]
                properties:
                  id: { type: integer }
                  service_id: { type: string }
                  key: { type: string, description: 'Plaintext, shown once' }
                  key_prefix: { type: string }
                  sample_rate: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
  /keys/{id}/revoke:
    post:
      operationId: revokeKey
      tags: [ingest]
      summary: Revoke a key (immediate)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Managed services with live state
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceView' }
    post:
      operationId: createService
      tags: [services]
      summary: Create a managed service
      description: |
        Validates the id (`^[a-z0-9-]+$`, unique), the strategy enum,
        the compose project/dir (dir must exist), the per-strategy
        config, and script executability, then audits `service_create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, strategy]
                properties:
                  id: { type: string }
                  strategy: { type: string, enum: [bluegreen, recreate] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: The service id already exists }
  /services/{id}:
    delete:
      operationId: deleteService
      tags: [services]
      summary: Remove a service from management
      description: |
        Deletes the service definition and all of its touchgrass-side
        rows (rules, keys, deploys, metrics, logs, issues, audit
        history) in one transaction, then audits `service_delete` as a
        global entry. Running containers are untouched — the workload
        keeps serving and shows up as unmanaged on the Fleet page.
      parameters:
        - $ref: '#/components/parameters/ServicePath'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Unknown service id }
  /services/{id}/metrics:
    get:
      operationId: listMetrics
      tags: [services]
      summary: Container samples, oldest first
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Samples
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    type: array
                    items: { $ref: '#/components/schemas/Metric' }
  /services/{id}/deploys:
    get:
      operationId: listDeploys
      tags: [services]
      summary: Deploy history, newest first
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [deploys]
                properties:
                  deploys:
                    type: array
                    items: { $ref: '#/components/schemas/Deploy' }
    post:
      operationId: recordDeploy
      tags: [services]
      summary: Record a manually-run deploy
      parameters:
        - $ref: '#/components/parameters/ServicePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha, actor, outcome]
              properties:
                sha: { type: string }
                actor: { type: string }
                type:
                  type: string
                  enum: [cutover, rollback, manual, deploy]
                  default: manual
                outcome:
                  type: string
                  enum: [success, failure]
                notes: { type: string }
                started_at: { type: string, format: date-time }
                finished_at: { type: string, format: date-time }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer }
  /services/{id}/cutover:
    post:
      operationId: startCutover
      tags: [services]
      summary: Start an async blue-green cutover (202 + poll history)
      parameters:
        - $ref: '#/components/parameters/ServicePath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [auto, blue, green]
                  default: auto
                  description: Empty means auto (the idle color)
      responses:
        '202':
          description: Cutover started
          content:
            application/json:
              schema:
                type: object
                required: [target]
                properties:
                  target: { type: string }
        '409': { description: A run is already in flight for this service }
  /services/{id}/rollback:
    post:
      operationId: startRollback
      tags: [services]
      summary: Start an async rollback to the opposite live color
      parameters:
        - $ref: '#/components/parameters/ServicePath'
      responses:
        '202':
          description: Rollback started
          content:
            application/json:
              schema:
                type: object
                required: [target]
                properties:
                  target: { type: string }
        '409': { description: A run is already in flight for this service }
  /services/{id}/deploy:
    post:
      operationId: startDeploy
      tags: [services]
      summary: Start an async recreate deploy
      parameters:
        - $ref: '#/components/parameters/ServicePath'
      responses:
        '202':
          description: Deploy started
          content:
            application/json:
              schema:
                type: object
                required: [target]
                properties:
                  target: { type: string, description: Compose service name }
        '409': { description: A run is already in flight for this service }
  /onboarding/suggest:
    get:
      operationId: suggestService
      tags: [onboarding]
      summary: Draft a service row for one fleet container
      description: |
        Drafts project/service/dir from compose labels, the service id
        from the project name, the health URL by probing the lowest
        published host port, and blue-green fields when an X-blue +
        X-green pair shares the project. Read-only.
      parameters:
        - name: container
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Drafted service row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: The container is already managed by a service }
  /alerts/rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      summary: List a service's metric alert rules
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: '#/components/schemas/AlertRule' }
    post:
      operationId: createAlertRule
      tags: [alerts]
      summary: Create a metric alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, metric, threshold, duration_secs]
              properties:
                service_id: { type: string }
                metric: { type: string, enum: [cpu, mem, disk] }
                threshold: { type: number }
                duration_secs: { type: integer }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
  /alerts/rules/{id}:
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      summary: Delete a metric alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications:
    get:
      operationId: listNotifications
      tags: [alerts]
      summary: Notifications newest first, with unread count
      parameters:
        - name: service_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [notifications, unread]
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread: { type: integer }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [alerts]
      summary: Mark one notification read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Marked read }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [alerts]
      summary: Mark every unread notification read (optionally one service)
      parameters:
        - name: service_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }
  /audit:
    get:
      operationId: listAudit
      tags: [services]
      summary: Audit entries newest first
      parameters:
        - name: service_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit:
                    type: array
                    items: { $ref: '#/components/schemas/Audit' }
  /events:
    get:
      operationId: streamEvents
      tags: [services]
      summary: Server-sent live event stream
      responses:
        '200':
          description: text/event-stream of deploy, nginx, and issue events
          content:
            text/event-stream:
              schema: { type: string }
  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: A service's issues, newest activity first
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Issues
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/Issue' }
  /issues/occurrences:
    get:
      operationId: listRecentOccurrences
      tags: [issues]
      summary: A service's occurrences newest first, across issues
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Occurrences
          content:
            application/json:
              schema:
                type: object
                required: [occurrences]
                properties:
                  occurrences:
                    type: array
                    items: { $ref: '#/components/schemas/Occurrence' }
  /issues/{id}:
    get:
      operationId: getIssue
      tags: [issues]
      summary: One issue with recent occurrences
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Issue detail
          content:
            application/json:
              schema:
                type: object
                required: [issue, occurrences]
                properties:
                  issue: { $ref: '#/components/schemas/Issue' }
                  occurrences:
                    type: array
                    items: { $ref: '#/components/schemas/Occurrence' }
        '404': { $ref: '#/components/responses/NotFound' }
  /issues/{id}/logs:
    get:
      operationId: listIssueLogs
      tags: [issues]
      summary: Log lines around the newest occurrence, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: window_secs
          in: query
          description: ±window, 1-3600 (default 60)
          schema: { type: integer }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Linked lines
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/LogLine' }
  /issues/rules:
    get:
      operationId: listIssueRules
      tags: [issues]
      summary: List a service's issue alert rules
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: '#/components/schemas/IssueRule' }
    post:
      operationId: createIssueRule
      tags: [issues]
      summary: Create an issue alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, kind, threshold, window_secs]
              properties:
                service_id: { type: string }
                kind: { type: string, enum: [new_issue, spike] }
                threshold: { type: integer, description: Positive for spike; ignored for new_issue }
                window_secs: { type: integer }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueRule' }
  /issues/rules/{id}:
    delete:
      operationId: deleteIssueRule
      tags: [issues]
      summary: Delete an issue alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /logs:
    get:
      operationId: searchLogs
      tags: [logs]
      summary: Search collected lines or SDK rows, newest first
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - name: source
          in: query
          description: Row source (default containers)
          schema: { type: string, enum: [containers, sdk], default: containers }
        - name: q
          in: query
          description: Full-text AND query (containers) or message substring (sdk)
          schema: { type: string }
        - name: trace_id
          in: query
          description: Full trace id filter (sdk only; 400 with source=containers)
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
        - name: after
          in: query
          schema: { type: string, format: date-time }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: stream
          in: query
          schema: { type: string, enum: [stdout, stderr] }
        - name: level
          in: query
          description: Comma-separated set (sdk adds trace and fatal)
          schema: { type: string, example: 'error,warn' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lines, newest first
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    description: LogLine rows for source=containers (levels parsed at read time), SDKLog rows for source=sdk
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/LogLine'
                        - $ref: '#/components/schemas/SDKLog'
  /logs/stats:
    get:
      operationId: getLogStats
      tags: [logs]
      summary: Stored lines plus backpressure losses
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                required: [service_id, lines, drops, truncations]
                properties:
                  service_id: { type: string }
                  lines: { type: integer }
                  drops: { type: integer }
                  truncations: { type: integer }
  /logs/{id}:
    get:
      operationId: getLogContext
      tags: [logs]
      summary: One line with ±neighbors, oldest first
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: before
          in: query
          description: Older neighbors, 0-100 (default 20)
          schema: { type: integer }
        - name: after
          in: query
          description: Newer neighbors, 0-100 (default 20)
          schema: { type: integer }
      responses:
        '200':
          description: Context
          content:
            application/json:
              schema:
                type: object
                required: [anchor, before, after]
                properties:
                  anchor: { $ref: '#/components/schemas/LogLine' }
                  before:
                    type: array
                    items: { $ref: '#/components/schemas/LogLine' }
                  after:
                    type: array
                    items: { $ref: '#/components/schemas/LogLine' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docker/images:
    get:
      operationId: listImages
      tags: [system]
      summary: Local daemon images, newest first
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items: { $ref: '#/components/schemas/Image' }
  /docker/images/prune:
    post:
      operationId: pruneImages
      tags: [system]
      summary: Remove dangling images only
      responses:
        '200':
          description: Prune report
          content:
            application/json:
              schema:
                type: object
                required: [deleted, reclaimed_bytes]
                properties:
                  deleted: { type: integer }
                  reclaimed_bytes: { type: integer }
  /system:
    get:
      operationId: getSystem
      tags: [system]
      summary: Host + daemon + self snapshot (nulls where unavailable)
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSnapshot' }
  /system/containers:
    get:
      operationId: listFleetContainers
      tags: [system]
      summary: Complete current container inventory, including stopped containers
      parameters:
        - name: classification
          in: query
          schema: { type: string, enum: [managed, approved_observed, unknown, ignored, missing_expected] }
        - name: state
          in: query
          schema: { type: string, maxLength: 64 }
        - name: service_id
          in: query
          schema: { type: string, maxLength: 128 }
        - name: include_historical
          in: query
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema: { type: string, enum: [name, last_seen, state], default: name }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lifecycle inventory and collector freshness
          content:
            application/json:
              schema:
                type: object
                required: [containers, freshness]
                properties:
                  containers:
                    type: array
                    items: { $ref: '#/components/schemas/FleetContainer' }
                  freshness: { $ref: '#/components/schemas/ContainerFreshness' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /system/containers/{id}:
    get:
      operationId: getFleetContainer
      tags: [system]
      summary: Safe container lifecycle and security posture detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Container detail without environment variables, raw commands, or host mount sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /system/history:
    get:
      operationId: getSystemHistory
      tags: [system]
      summary: Bucket-averaged host history (at most 1500 points)
      description: |
        Metric mem reports used bytes. Buckets size to the window so the
        series never exceeds 1500 points. Hours above 168 clamp to 168.
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [cpu, mem, load] }
        - name: hours
          in: query
          schema: { type: integer, default: 24, minimum: 1, maximum: 168 }
      responses:
        '200':
          description: History points, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /performance/summary:
    get:
      operationId: getPerformanceSummary
      tags: [performance]
      summary: Compare bounded HTTP performance windows
      parameters:
        - $ref: '#/components/parameters/PerformanceServiceId'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
      responses:
        '200':
          description: Performance summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /performance/timeline:
    get:
      operationId: getPerformanceTimeline
      tags: [performance]
      summary: Align available performance signals and change markers
      parameters:
        - $ref: '#/components/parameters/PerformanceServiceId'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
      responses:
        '200':
          description: Performance timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceTimeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /performance/routes:
    get:
      operationId: getPerformanceRoutes
      tags: [performance]
      summary: Rank privacy-safe route families
      parameters:
        - $ref: '#/components/parameters/PerformanceServiceId'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
        - $ref: '#/components/parameters/PerformanceRouteFamily'
        - $ref: '#/components/parameters/PerformanceSort'
        - $ref: '#/components/parameters/PerformanceLimit'
      responses:
        '200':
          description: Route performance rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceRoutes' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /performance/postgres:
    get:
      operationId: getPerformancePostgres
      tags: [performance]
      summary: List bounded PostgreSQL metric buckets
      parameters:
        - $ref: '#/components/parameters/PerformanceServiceId'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
        - $ref: '#/components/parameters/PerformanceLimit'
      responses:
        '200':
          description: PostgreSQL metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativePerformanceMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /performance/redis:
    get:
      operationId: getPerformanceRedis
      tags: [performance]
      summary: List bounded Redis metric buckets
      parameters:
        - $ref: '#/components/parameters/PerformanceServiceId'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
        - $ref: '#/components/parameters/PerformanceLimit'
      responses:
        '200':
          description: Redis metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativePerformanceMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /collectors/status:
    get:
      operationId: getCollectorStatus
      tags: [performance]
      summary: Show last success, error, losses, and staleness by source
      responses:
        '200':
          description: Collector status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorStatuses' }
  /services/{id}/performance/summary:
    get:
      operationId: getServicePerformanceSummary
      tags: [performance]
      summary: Compare one service's bounded HTTP performance windows
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
      responses:
        '200':
          description: Performance summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services/{id}/performance/timeline:
    get:
      operationId: getServicePerformanceTimeline
      tags: [performance]
      summary: Align one service's available performance signals
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
      responses:
        '200':
          description: Performance timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceTimeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services/{id}/performance/routes:
    get:
      operationId: getServicePerformanceRoutes
      tags: [performance]
      summary: Rank one service's privacy-safe route families
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
        - $ref: '#/components/parameters/PerformanceRouteFamily'
        - $ref: '#/components/parameters/PerformanceSort'
        - $ref: '#/components/parameters/PerformanceLimit'
      responses:
        '200':
          description: Route performance rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceRoutes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services/{id}/performance/postgres:
    get:
      operationId: getServicePerformancePostgres
      tags: [performance]
      summary: List one service's bounded PostgreSQL metrics
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
        - $ref: '#/components/parameters/PerformanceLimit'
      responses:
        '200':
          description: PostgreSQL metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativePerformanceMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services/{id}/performance/redis:
    get:
      operationId: getServicePerformanceRedis
      tags: [performance]
      summary: List one service's bounded Redis metrics
      parameters:
        - $ref: '#/components/parameters/ServicePath'
        - $ref: '#/components/parameters/PerformanceStart'
        - $ref: '#/components/parameters/PerformanceEnd'
        - $ref: '#/components/parameters/PerformanceResolution'
        - $ref: '#/components/parameters/PerformanceLimit'
      responses:
        '200':
          description: Redis metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativePerformanceMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /databases:
    get:
      operationId: listDatabases
      tags: [databases]
      summary: Postgres, redis, and sqlite health
      description: |
        Always returns all three entries in postgres/redis/sqlite order.
        Unconfigured entries report configured false; failed probes degrade
        to reachable false with null stats instead of erroring.
      responses:
        '200':
          description: Health entries
          content:
            application/json:
              schema:
                type: object
                required: [databases]
                properties:
                  databases:
                    type: array
                    items: { $ref: '#/components/schemas/Database' }
  /databases/backups:
    get:
      operationId: listBackups
      tags: [databases]
      summary: Backup artifacts, newest first
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items: { $ref: '#/components/schemas/BackupInfo' }
    post:
      operationId: startBackup
      tags: [databases]
      summary: Start an async pg_dump backup (202 + poll jobs)
      description: |
        Streams pg_dump -Fc to <db>-<UTC>.dump at 0600 plus a .sha256
        sidecar, then trims to TOUCHGRASS_DB_BACKUP_KEEP newest.
        One database job runs at a time across backup and restore.
      responses:
        '202':
          description: Backup started
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [running] }
        '409': { description: A database job is already running }
        '503': { description: Postgres is not configured }
  /databases/backups/{name}/verify:
    post:
      operationId: verifyBackup
      tags: [databases]
      summary: Verify one backup (sha256 + pg_restore --list)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.-]+\.dump$' }
      responses:
        '200':
          description: Verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupVerify' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Postgres is not configured }
  /databases/restore:
    post:
      operationId: startRestore
      tags: [databases]
      summary: Start an async restore of one backup (202 + poll jobs)
      description: |
        Takes a <db>-pre-restore-<UTC>.dump safety backup first, terminates
        other backends, then pg_restore --clean --if-exists with the dump on
        stdin (never DROP DATABASE), verified by SELECT 1 plus a public
        table count. One database job runs at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9_.-]+\.dump$' }
      responses:
        '202':
          description: Restore started
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [running] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: A database job is already running }
        '503': { description: Postgres is not configured }
  /databases/jobs:
    get:
      operationId: listDatabaseJobs
      tags: [databases]
      summary: Job history, newest first (last 20)
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/DBJob' }
  /databases/jobs/{id}:
    get:
      operationId: getDatabaseJob
      tags: [databases]
      summary: One database job by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DBJob' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/summary:
    get:
      operationId: getSecuritySummary
      tags: [security]
      summary: Current finding counts and collector coverage
      responses:
        '200':
          description: Security posture summary; coverage_complete is false after a partial collector result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecuritySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /security/findings:
    get:
      operationId: listSecurityFindings
      tags: [security]
      summary: List bounded finding episodes
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, acknowledged, resolved, suppressed] } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: container_id, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [last_seen, opened, severity] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Findings (the findings array is always present)
          content:
            application/json:
              schema:
                type: object
                required: [findings, limit, offset]
                properties:
                  findings: { type: array, items: { $ref: '#/components/schemas/SecurityFinding' } }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /security/findings/{id}:
    get:
      operationId: getSecurityFinding
      tags: [security]
      summary: Get one finding episode
      parameters: [{ $ref: '#/components/parameters/SecurityID' }]
      responses:
        '200':
          description: Finding
          content: { application/json: { schema: { $ref: '#/components/schemas/SecurityFinding' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/findings/{id}/acknowledge:
    post:
      operationId: acknowledgeSecurityFinding
      tags: [security]
      summary: Acknowledge one open finding as the authenticated admin
      parameters: [{ $ref: '#/components/parameters/SecurityID' }]
      responses:
        '200': { description: Acknowledged finding, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityFinding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/findings/{id}/resolve:
    post:
      operationId: resolveSecurityFinding
      tags: [security]
      summary: Resolve one active finding as the authenticated admin
      parameters: [{ $ref: '#/components/parameters/SecurityID' }]
      responses:
        '200': { description: Resolved finding, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityFinding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/findings/{id}/suppress:
    post:
      operationId: suppressSecurityFinding
      tags: [security]
      summary: Suppress one active finding with an auditable reason
      parameters: [{ $ref: '#/components/parameters/SecurityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
                until: { type: ['string', 'null'], format: date-time, description: Must be in the future; null is non-expiring }
      responses:
        '200': { description: Suppressed finding, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityFinding' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /security/policies:
    get:
      operationId: listSecurityPolicies
      tags: [security]
      summary: List security policies
      responses:
        '200':
          description: Policies (the policies array is always present)
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties: { policies: { type: array, items: { $ref: '#/components/schemas/SecurityPolicy' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSecurityPolicy
      tags: [security]
      summary: Create a global, service, or container policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, policy]
              properties:
                scope: { type: string, enum: [global, service, container] }
                scope_id: { type: string, description: Required for service and container scopes }
                policy: { $ref: '#/components/schemas/SecurityPolicyBody' }
      responses:
        '201': { description: Created policy, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityPolicy' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /security/policies/{id}:
    patch:
      operationId: updateSecurityPolicy
      tags: [security]
      summary: Replace a policy body while preserving scope
      parameters: [{ $ref: '#/components/parameters/SecurityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties: { policy: { $ref: '#/components/schemas/SecurityPolicyBody' } }
      responses:
        '200': { description: Updated policy, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityPolicy' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSecurityPolicy
      tags: [security]
      summary: Delete a security policy
      parameters: [{ $ref: '#/components/parameters/SecurityID' }]
      responses:
        '204': { description: Policy deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: touchgrass_session
      description: Session cookie from POST /api/auth/login
    keyAuth:
      type: apiKey
      in: header
      name: X-Touchgrass-Key
      description: Per-service tg_ ingestion key
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-service tg_ ingestion key as a Bearer token
  parameters:
    ServiceId:
      name: service_id
      in: query
      required: true
      schema: { type: string }
    ServicePath:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }
    KeyHeader:
      name: X-Touchgrass-Key
      in: header
      required: true
      schema: { type: string }
    PerformanceServiceId:
      name: service_id
      in: query
      schema: { type: string }
    PerformanceStart:
      name: start
      in: query
      schema: { type: string, format: date-time }
    PerformanceEnd:
      name: end
      in: query
      schema: { type: string, format: date-time }
    PerformanceResolution:
      name: resolution
      in: query
      schema: { type: string, enum: [auto, minute, hour], default: auto }
    PerformanceRouteFamily:
      name: route_family
      in: query
      schema:
        type: string
        enum: [health, auth, public_events, account_orders, checkout, callbacks, admin, organization, static, other]
    PerformanceSort:
      name: sort
      in: query
      schema: { type: string, enum: [p95_ms, request_count, error_rate, route_family], default: p95_ms }
    PerformanceLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    SecurityID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or bad credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid session without the admin role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SecuritySummary:
      type: object
      required: [open, critical, high, suppressed, coverage_complete]
      properties:
        open: { type: integer, minimum: 0 }
        critical: { type: integer, minimum: 0 }
        high: { type: integer, minimum: 0 }
        suppressed: { type: integer, minimum: 0 }
        coverage_complete: { type: boolean, description: True only when posture, process, and writable-layer collectors are complete and each reported within twice its effective interval }
        last_observed_at: { type: ['string', 'null'], format: date-time }
    SecurityFinding:
      type: object
      required: [id, fingerprint, episode, container_id, rule_id, category, severity, confidence, status, occurrence_count, opened_at, last_seen_at, evidence]
      properties:
        id: { type: integer }
        fingerprint: { type: string }
        episode: { type: integer, minimum: 1 }
        container_id: { type: string }
        rule_id: { type: string }
        category: { type: string, enum: [posture, process, drift] }
        severity: { type: string, enum: [low, medium, high, critical] }
        confidence: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, acknowledged, resolved, suppressed] }
        occurrence_count: { type: integer, minimum: 1 }
        evidence:
          type: object
          additionalProperties: { type: string }
          description: Bounded normalized metadata only; never environment values, full arguments, mount sources, or file contents
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        acknowledged_at: { type: ['string', 'null'], format: date-time }
        acknowledged_by: { type: string }
        resolved_at: { type: ['string', 'null'], format: date-time }
        resolved_by: { type: string }
        suppressed_until: { type: ['string', 'null'], format: date-time }
        suppression_reason: { type: string }
        suppression_actor: { type: string }
        notification_status: { type: string, enum: ['', delivered, degraded] }
    SecurityPolicyBody:
      type: object
      properties:
        allow_privileged: { type: boolean }
        allow_host_pid: { type: boolean }
        allow_host_network: { type: boolean }
        allow_docker_socket: { type: boolean }
        allow_root: { type: boolean }
        allow_writable_root_fs: { type: boolean }
        allowed_capabilities: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
        allowed_published_ports: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
        allowed_executable_paths: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
        allowed_writable_paths: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
    SecurityPolicy:
      allOf:
        - $ref: '#/components/schemas/SecurityPolicyBody'
        - type: object
          required: [id, scope, scope_id, updated_by, updated_at]
          properties:
            id: { type: integer }
            scope: { type: string, enum: [global, service, container] }
            scope_id: { type: string }
            updated_by: { type: string }
            updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, example: ok }
        version: { type: string }
    PerformanceSnapshot:
      type: object
      required: [request_count, error_count, error_rate, average_ms, p50_ms, p95_ms, p99_ms]
      properties:
        request_count: { type: integer }
        error_count: { type: integer }
        error_rate: { type: number }
        average_ms: { type: number }
        p50_ms: { type: number }
        p95_ms: { type: number }
        p99_ms: { type: number }
    PerformanceSummary:
      allOf:
        - $ref: '#/components/schemas/PerformanceSnapshot'
        - type: object
          required: [start, end, resolution, previous, anomalies]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            resolution: { type: string, enum: [minute, hour] }
            previous: { $ref: '#/components/schemas/PerformanceSnapshot' }
            anomalies:
              type: array
              items:
                type: object
                required: [kind, score, summary]
                properties:
                  kind: { type: string }
                  score: { type: number }
                  summary: { type: string }
    PerformanceTimeline:
      type: object
      required: [start, end, resolution, points, events, deployments]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        resolution: { type: string, enum: [minute, hour] }
        points:
          type: array
          items: { type: object, additionalProperties: true }
        events:
          type: array
          items: { type: object, additionalProperties: true }
        deployments:
          type: array
          items: { $ref: '#/components/schemas/Deploy' }
    PerformanceRoutes:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items: { type: object, additionalProperties: true }
    NativePerformanceMetrics:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          items: { type: object, additionalProperties: true }
    CollectorStatuses:
      type: object
      required: [collectors]
      properties:
        collectors:
          type: array
          items:
            type: object
            required: [source, dropped_records, coverage_complete, stale]
            properties:
              source: { type: string }
              last_success_at: { type: string, format: date-time }
              last_recorded_at: { type: string, format: date-time }
              last_error: { type: string }
              dropped_records: { type: integer }
              coverage_complete: { type: boolean, description: False when the latest collector result was partial }
              effective_interval_secs: { type: integer, minimum: 0 }
              stale: { type: boolean }
    User:
      type: object
      required: [id, username, role, disabled, created_at]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    StackFrame:
      type: object
      required: [function, file, line, column]
      properties:
        function: { type: string }
        file: { type: string }
        line: { type: integer }
        column: { type: integer }
    Breadcrumb:
      type: object
      required: [at, category, message]
      properties:
        at: { type: string }
        category: { type: string }
        message: { type: string }
    IngestReport:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [exception, message] }
        message: { type: string }
        stack:
          type: array
          items: { $ref: '#/components/schemas/StackFrame' }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/Breadcrumb' }
        release: { type: string }
    Occurrence:
      allOf:
        - $ref: '#/components/schemas/IngestReport'
        - type: object
          required: [id, service_id, created_at]
          properties:
            id: { type: integer }
            service_id: { type: string }
            issue_id: { type: ['integer', 'null'] }
            created_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [id, service_id, key_prefix, sample_rate, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        key_prefix: { type: string }
        sample_rate: { type: number }
        revoked_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ServiceView:
      type: object
      required: [id, name, strategy, live_color, health, colors, containers]
      properties:
        id: { type: string }
        name: { type: string }
        strategy: { type: string, enum: [bluegreen, recreate, unknown] }
        live_color: { type: string }
        health: { type: string, enum: [healthy, unhealthy, unknown] }
        colors:
          type: array
          items:
            type: object
            required: [name, live, health, target, health_url]
            properties:
              name: { type: string }
              live: { type: boolean }
              health: { type: string }
              target: { type: string }
              health_url: { type: string }
        containers:
          type: array
          items:
            type: object
            required: [id, name, image, sha, state, status, ports]
            properties:
              id: { type: string }
              name: { type: string }
              image: { type: string }
              sha: { type: string }
              state: { type: string }
              status: { type: string }
              ports:
                type: array
                items: { type: string }
    ServiceSuggestion:
      type: object
      required: [container, service_id, strategy, compose_project, compose_dir, service,
        health_url, public_url, deploy_script, rollback_script, confidence, reasons, warnings]
      properties:
        container: { type: string }
        service_id: { type: string }
        strategy: { type: string, enum: [bluegreen, recreate] }
        compose_project: { type: string }
        compose_dir: { type: string }
        service: { type: string }
        health_url: { type: string }
        public_url: { type: string }
        deploy_script: { type: string }
        rollback_script: { type: string }
        blue_service: { type: string }
        green_service: { type: string }
        blue_target: { type: string }
        green_target: { type: string }
        blue_url: { type: string }
        green_url: { type: string }
        nginx_conf: { type: string }
        marker: { type: string }
        cutover_script: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
        reasons:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    CreateServiceRequest:
      type: object
      required: [id, strategy, compose_project, compose_dir, config]
      properties:
        id: { type: string, description: 'Lowercase slug: ^[a-z0-9-]+$' }
        name: { type: string, description: Display name; defaults to the id }
        strategy: { type: string, enum: [bluegreen, recreate] }
        compose_project: { type: string }
        compose_dir: { type: string }
        config:
          type: object
          description: Raw strategy JSON (recreate or blue-green fields)
    Metric:
      type: object
      required: [id, service_id, container_name, sampled_at, cpu_percent, mem_bytes, mem_limit, disk_bytes, restarts, uptime_secs]
      properties:
        id: { type: integer }
        service_id: { type: string }
        container_name: { type: string }
        sampled_at: { type: string, format: date-time }
        cpu_percent: { type: number }
        mem_bytes: { type: integer }
        mem_limit: { type: integer }
        disk_bytes: { type: integer }
        restarts: { type: integer }
        uptime_secs: { type: integer }
    Deploy:
      type: object
      required: [id, service_id, sha, actor, type, outcome, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        sha: { type: string }
        actor: { type: string }
        type: { type: string, enum: [cutover, rollback, manual, deploy] }
        outcome: { type: string, enum: [success, failure] }
        started_at: { type: ['string', 'null'], format: date-time }
        finished_at: { type: ['string', 'null'], format: date-time }
        duration_secs: { type: ['integer', 'null'] }
        downtime_secs: { type: ['number', 'null'] }
        notes: { type: string }
        created_at: { type: string, format: date-time }
    AlertRule:
      type: object
      required: [id, service_id, metric, threshold, duration_secs, enabled, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        metric: { type: string, enum: [cpu, mem, disk] }
        threshold: { type: number }
        duration_secs: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, service_id, kind, title, body, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        kind: { type: string, enum: [alert_breach, deploy, issue] }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: ['string', 'null'], format: date-time }
    Audit:
      type: object
      required: [id, actor, action, result, detail, created_at]
      properties:
        id: { type: integer }
        service_id: { type: ['string', 'null'] }
        actor: { type: string }
        action: { type: string, enum: [cutover, rollback, login, deploy, db_backup, db_restore, service_create, service_delete, user_create, user_update, user_delete] }
        result: { type: string, enum: [success, failure] }
        detail: { type: string }
        created_at: { type: string, format: date-time }
    Issue:
      type: object
      required: [id, service_id, fingerprint, title, first_seen, last_seen, count, releases, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        count: { type: integer }
        releases:
          type: array
          items: { type: string }
        notified_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    IssueRule:
      type: object
      required: [id, service_id, kind, threshold, window_secs, enabled, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        kind: { type: string, enum: [new_issue, spike] }
        threshold: { type: integer }
        window_secs: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    SDKLogAttribute:
      type: object
      required: [value, type]
      properties:
        value:
          type: [string, number, boolean]
          description: Must match the declared type (integer values are whole numbers)
        type: { type: string, enum: [string, integer, double, boolean] }
    SDKLogItem:
      type: object
      required: [timestamp, level, body]
      properties:
        timestamp:
          type: number
          description: Event time as unix seconds (float)
        level: { type: string, enum: [trace, debug, info, warn, error, fatal] }
        body: { type: string, minLength: 1, maxLength: 8192 }
        severity_number:
          type: integer
          minimum: 1
          maximum: 24
          description: OTel severity; inferred from level (1/5/9/13/17/21) when absent
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        span_id: { type: string, pattern: '^[0-9a-f]{16}$' }
        attributes:
          type: object
          maxProperties: 64
          additionalProperties: { $ref: '#/components/schemas/SDKLogAttribute' }
    SDKLogBatch:
      type: object
      required: [items]
      properties:
        release: { type: string, maxLength: 128 }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/SDKLogItem' }
    SDKLogItemError:
      type: object
      required: [error, index]
      properties:
        error: { type: string }
        index:
          type: integer
          description: Zero-based position of the invalid item in the batch
    SDKLog:
      type: object
      required: [id, service_id, ts, level, severity_number, message, attributes, trace_id, span_id, release, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [trace, debug, info, warn, error, fatal] }
        severity_number: { type: integer, minimum: 1, maximum: 24 }
        message: { type: string }
        attributes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SDKLogAttribute' }
        trace_id: { type: string }
        span_id: { type: string }
        release: { type: string }
        created_at: { type: string, format: date-time }
    LogLine:
      type: object
      required: [id, service_id, container, stream, level, line, ts, created_at]
      properties:
        id: { type: integer }
        service_id: { type: string }
        container: { type: string }
        stream: { type: string, enum: [stdout, stderr] }
        level: { type: string, enum: [error, warn, info, debug] }
        line: { type: string }
        ts: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Image:
      type: object
      required: [id, repo_tags, size_bytes, created_at, containers, dangling]
      properties:
        id: { type: string }
        repo_tags:
          type: array
          items: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        containers: { type: integer }
        dangling: { type: boolean }
    Database:
      type: object
      required: [id, label, configured, reachable]
      properties:
        id: { type: string, enum: [postgres, redis, sqlite] }
        label: { type: string }
        configured: { type: boolean }
        reachable: { type: boolean }
        version: { type: string }
        size_bytes: { type: integer }
        connections_used: { type: integer }
        connections_max: { type: integer }
        uptime_secs: { type: integer }
        used_memory_bytes: { type: integer }
        integrity: { type: string }
        last_backup_at: { type: string, format: date-time }
    BackupInfo:
      type: object
      required: [name, size_bytes, created_at, sha256]
      properties:
        name: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        sha256: { type: string, enum: [present, missing] }
    DBJob:
      type: object
      required: [id, kind, target, status, detail, started_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [backup, restore] }
        target: { type: string }
        status: { type: string, enum: [running, success, failed] }
        detail: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: ['string', 'null'], format: date-time }
    BackupVerify:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }
    FleetContainer:
      type: object
      required: [name, project, managed, state, classification, current, present, health, cpu_percent, mem_bytes, mem_limit, restarts, risk_counts]
      properties:
        id: { type: string }
        name: { type: string }
        project: { type: string }
        managed: { type: boolean }
        service_id: { type: string }
        state: { type: string }
        status: { type: string }
        classification: { type: string, enum: [managed, approved_observed, unknown, ignored, missing_expected] }
        current: { type: boolean }
        present: { type: boolean }
        health: { type: string }
        cpu_percent: { type: ['number', 'null'] }
        mem_bytes: { type: ['integer', 'null'] }
        mem_limit: { type: ['integer', 'null'] }
        restarts: { type: ['integer', 'null'] }
        sampled_at: { type: string, format: date-time }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        absent_at: { type: ['string', 'null'], format: date-time }
        risk_counts:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
    ContainerFreshness:
      type: object
      required: [reconciled_at, complete, stale, observed_count]
      properties:
        reconciled_at: { type: ['string', 'null'], format: date-time }
        complete: { type: boolean }
        stale: { type: boolean }
        last_error_category: { type: string }
        observed_count: { type: integer }
    SafeContainerInspection:
      type: object
      required: [coverage_complete, user, privileged, readonly_root_fs, cap_add, mounts, has_docker_socket]
      properties:
        coverage_complete: { type: boolean, description: False when values are last-known posture from before a Docker inspection failure }
        user: { type: string }
        entrypoint_hash: { type: string }
        command_hash: { type: string }
        privileged: { type: boolean }
        readonly_root_fs: { type: boolean }
        cap_add: { type: array, items: { type: string } }
        pid_mode: { type: string }
        ipc_mode: { type: string }
        network_mode: { type: string }
        restart_policy: { type: string }
        memory_bytes: { type: integer }
        nano_cpus: { type: integer }
        pids_limit: { type: ['integer', 'null'] }
        mounts:
          type: array
          items:
            type: object
            required: [type, destination, writable]
            properties:
              type: { type: string }
              destination: { type: string }
              writable: { type: boolean }
        has_docker_socket: { type: boolean }
    ContainerDetail:
      type: object
      required: [container, image, image_id, inspection]
      properties:
        container: { $ref: '#/components/schemas/FleetContainer' }
        image: { type: string }
        image_id: { type: string }
        inspection: { $ref: '#/components/schemas/SafeContainerInspection' }
    HistoryPoint:
      type: object
      required: [ts, value]
      properties:
        ts: { type: string, format: date-time }
        value: { type: number }
    SystemSnapshot:
      type: object
      required: [hostname, os, arch, self]
      properties:
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        uptime_secs: { type: ['integer', 'null'] }
        load_1: { type: ['number', 'null'] }
        cpu_percent: { type: ['number', 'null'] }
        mem_used_bytes: { type: ['integer', 'null'] }
        mem_total_bytes: { type: ['integer', 'null'] }
        disk_used_bytes: { type: ['integer', 'null'] }
        disk_total_bytes: { type: ['integer', 'null'] }
        docker:
          type: ['object', 'null']
          required: [server_version, architecture, operating_system, kernel_version, ncpu, mem_total_bytes, containers_running, containers_stopped, images]
          properties:
            server_version: { type: string }
            architecture: { type: string }
            operating_system: { type: string }
            kernel_version: { type: string }
            ncpu: { type: integer }
