# Install in Nginx's http context after route-families.map. This dedicated
# stream deliberately excludes raw paths, query strings, request/response
# headers, cookies, client addresses, referrers, and user agents.
log_format touchgrass_timing escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"method":"$request_method",'
      '"status":"$status",'
      '"route_family":"$touchgrass_route_family",'
      '"request_time":"$request_time",'
      '"upstream_connect_time":"$upstream_connect_time",'
      '"upstream_header_time":"$upstream_header_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"upstream_addr":"$upstream_addr",'
      '"bytes_sent":"$bytes_sent",'
      '"request_length":"$request_length",'
      '"connection_requests":"$connection_requests"'
    '}';

# Nginx owns this file. Touch Grass mounts its directory read-only and keeps a
# persisted inode/offset cursor across rotations.
access_log /var/log/nginx/ticketnation-performance/requests.jsonl touchgrass_timing buffer=64k flush=5s;
