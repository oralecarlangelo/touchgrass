name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "1.27"
          - "stable"

    steps:
      - uses: actions/checkout@v6
        with:
          # The affected-package selection diffs against the base branch.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      # A pull request tests only the packages its diff affects (the changed
      # packages plus everything that depends on them). A push to develop or
      # main, and any change to go.mod, the Makefile or CI itself, runs the
      # full suite. See AGENTS.md, "Testing".
      - name: Select packages to test
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            packages="$(./scripts/affected-packages.sh "origin/$BASE_REF")"
          else
            packages="ALL"
          fi
          if [ -z "$packages" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No Go package is affected; skipping build and tests."
          elif [ "$packages" = "ALL" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Running the full suite."
          else
            echo "mode=affected" >> "$GITHUB_OUTPUT"
            { echo "packages<<EOF"; echo "$packages"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "Affected packages:"
            echo "$packages"
          fi

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go mod tidy produced changes; run it locally and commit the result"
            git status --porcelain -- go.mod go.sum
            exit 1
          fi

      - name: Set up Node
        if: steps.select.outputs.mode != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI and docs site
        if: steps.select.outputs.mode != 'none'
        run: |
          npm ci --prefix web
          npm run build --prefix web
          npm ci --prefix docs-site
          npm run build --prefix docs-site

      - name: Build
        if: steps.select.outputs.mode != 'none'
        run: make build

      - name: Run tests (full suite)
        if: steps.select.outputs.mode == 'all'
        run: go test -race -shuffle=on -coverprofile=coverage.out ./cmd/... ./internal/... ./migrations/... ./web ./docs-site

      - name: Run tests (affected packages)
        if: steps.select.outputs.mode == 'affected'
        env:
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          # shellcheck disable=SC2086 # one import path per line, split on purpose
          go test -race -shuffle=on $PACKAGES

      - name: Upload coverage
        if: matrix.go == 'stable' && steps.select.outputs.mode == 'all'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI and docs site
        run: |
          npm ci --prefix web
          npm run build --prefix web
          npm ci --prefix docs-site
          npm run build --prefix docs-site

      - name: Run go vet
        run: make vet

      - name: golangci-lint (correctness and security)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: >-
            --enable-only=govet,staticcheck,unused,errcheck,errorlint,nilerr,forcetypeassert,copyloopvar,durationcheck,reassign,gosec,bidichk,bodyclose,noctx,containedctx,fatcontext,sqlclosecheck,rowserrcheck
            --timeout 5m ./cmd/... ./internal/... ./migrations/... ./web ./docs-site

      - name: golangci-lint (new issues)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: >-
            --new-from-rev=HEAD~
            --timeout 5m ./cmd/... ./internal/... ./migrations/... ./web ./docs-site

      - name: Verify web UI and docs site
        run: |
          npm run verify --prefix web
          npm run verify --prefix docs-site

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make audit
